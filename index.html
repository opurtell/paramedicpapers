<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF8">
  <title>Paramedic Research Updates — Daily Prehospital Research Scan</title>
  <meta name="description" content="Daily curated scan of the latest paramedic and prehospital research papers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚑</text></svg>">
</head>
<body>

  <header class="masthead">
    <div class="masthead-row">
      <div>
        <h1 id="page-title">Paramedic Papers</h1>
        <p class="kicker" id="page-kicker">Loading…</p>
      </div>
      <div class="masthead-actions">
        <span class="updated" id="last-updated"></span>
        <button class="icon-btn" id="btn-refresh" type="button" title="Refresh data" aria-label="Refresh data">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">

    <!-- ── HOME ───────────────────────────────────────────── -->
    <section class="page" id="page-home">
      <article class="panel panel-dark" id="fun-fact-panel">
        <div class="panel-kicker panel-kicker-invert">Fun fact of the day</div>
        <p class="fact-headline" id="fun-fact-headline"></p>
        <div class="collapse" id="fun-fact-body" hidden></div>
        <button class="link-btn link-btn-invert" id="fun-fact-toggle" type="button" aria-expanded="false">Read more</button>
      </article>

      <article class="panel" id="daily-tldr-panel">
        <div class="panel-head">
          <span class="panel-kicker panel-kicker-accent">Today's TLDR</span>
          <button class="sign-btn" id="daily-tldr-toggle" type="button" aria-expanded="false" aria-label="Expand today's TLDR">+</button>
        </div>
        <p class="panel-lead" id="daily-tldr-lead"></p>
        <div class="collapse bullets" id="daily-tldr-body" hidden></div>
      </article>

      <article class="panel" id="weekly-tldr-panel-home">
        <div class="panel-head">
          <span class="panel-kicker">This week's TLDR</span>
          <button class="sign-btn" id="weekly-tldr-toggle-home" type="button" aria-expanded="false" aria-label="Expand this week's TLDR">+</button>
        </div>
        <p class="panel-lead" id="weekly-tldr-lead-home"></p>
        <div class="collapse bullets" id="weekly-tldr-body-home" hidden></div>
      </article>

      <div class="section-head">
        <h2>Today's newest</h2>
        <span class="count-flag" id="today-count"></span>
      </div>
      <div class="today-list" id="today-list"></div>

      <button class="wide-btn" id="btn-open-feed" type="button">Open full feed</button>
    </section>

    <!-- ── FEED ───────────────────────────────────────────── -->
    <section class="page" id="page-feed" hidden>
      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="Search title, journal, summary" autocomplete="off">
      </div>
      <div class="controls">
        <div class="chips" role="group" aria-label="Sort">
          <button class="chip is-on" data-sort="newest" type="button">Newest</button>
          <button class="chip" data-sort="relevance" type="button">Relevance</button>
        </div>
        <span class="result-count" id="result-count"></span>
      </div>
      <div id="pinned-slot"></div>
      <div id="feed-list"></div>
      <p class="empty" id="feed-empty" hidden>No papers match that search.</p>
    </section>

    <!-- ── WEEKLY ─────────────────────────────────────────── -->
    <section class="page" id="page-weekly" hidden>
      <article class="panel">
        <div class="panel-head">
          <span class="panel-kicker panel-kicker-accent">Week's TLDR</span>
          <button class="sign-btn" id="weekly-tldr-toggle" type="button" aria-expanded="true" aria-label="Collapse week's TLDR">−</button>
        </div>
        <p class="panel-lead" id="weekly-tldr-lead"></p>
        <div class="collapse bullets" id="weekly-tldr-body"></div>
      </article>

      <div class="section-head">
        <h2>Editor's picks</h2>
        <span class="muted-flag" id="weekly-pick-count"></span>
      </div>
      <div id="weekly-picks"></div>
    </section>

    <!-- ── SAVED ──────────────────────────────────────────── -->
    <section class="page" id="page-saved" hidden>
      <div id="saved-list"></div>
      <div class="empty-state" id="saved-empty" hidden>
        <span class="bookmark-mark" aria-hidden="true"></span>
        <h2>Nothing saved yet</h2>
        <p>Tap Save on any paper to keep it here for your next shift.</p>
      </div>
    </section>

  </main>

  <nav class="tabbar" aria-label="Primary">
    <button class="tab is-on" data-tab="home" type="button"><span class="ico ico-home" aria-hidden="true"></span>Home</button>
    <button class="tab" data-tab="feed" type="button"><span class="ico ico-feed" aria-hidden="true"><i></i><i></i><i></i></span>Feed</button>
    <button class="tab" data-tab="weekly" type="button"><span class="ico ico-weekly" aria-hidden="true"></span>Weekly</button>
    <button class="tab" data-tab="saved" type="button"><span class="ico ico-saved" aria-hidden="true"></span>Saved</button>
  </nav>

  <script src="js/app.js?v=3"></script>
</body>
</html>
